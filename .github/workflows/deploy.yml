name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      invite-paths: ${{ steps.invite-paths.outputs.paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload Astro site
        uses: withastro/action@v6

      - name: Collect invite page paths
        id: invite-paths
        run: |
          # Read the paths off the build rather than hardcoding them, so a new
          # invite page is listed the moment it exists. Only directories with
          # an index.html count, which excludes dist/assets and dist/CNAME.
          paths=""
          if [ -d dist ]; then
            paths=$(find dist -mindepth 2 -maxdepth 2 -name index.html \
              | sed 's|^dist/||; s|/index.html$||' | sort | paste -sd, -)
          fi
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Found invite pages: ${paths:-none}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print invite page URLs
        env:
          # page_url follows the custom domain once one is configured, so the
          # links printed here are the ones actually worth sharing.
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INVITE_PATHS: ${{ needs.build.outputs.invite-paths }}
          # WhatsApp caches a link preview against the exact URL and offers no
          # way to purge it, so each deploy hands out a URL it has never seen.
          # run_number rather than the SHA: it only ever goes up, so it's easy
          # to tell at a glance which link is the newer one.
          VERSION: ${{ github.run_number }}
        run: |
          base="${PAGE_URL%/}"
          {
            echo "## Invite page URLs"
            echo
            for path in ${INVITE_PATHS//,/ }; do
              echo "- $base/$path?v=$VERSION"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
